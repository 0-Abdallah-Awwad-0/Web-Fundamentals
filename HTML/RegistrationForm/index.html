<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="submit-form.php" method="post">
        <h1>Registration Form</h1>
        <div>
            <label for="name-name">First Name: *</label>
            <input type="text" name="first-name">
        </div>
        <div>
            <label for="last-name">Last Name:*</label>
            <input type="text" name="last-name">
        </div>
        <div>
            <label for="email">Email Address:*</label>
            <input type="text" name="email">
        </div>
        <div>
            <label for="password">Password:*</label>
            <input type="password" name="password">
        </div>
        <div>
            <label for="confirm-password">Confirm Password:*</label>
            <input type="password" name="confirm-password">
        </div>
        <div>
            <label for="birthday">Birthday:</label>
            <input type="date" name="birthday">
        </div>
        <div>
            <label for="gender">Gender Identity:</label>
            <input type="radio" name="gender">
            <label for="gender">Male</label>
            <input type="radio" name="gender">
            <label for="gender">Female</label>
            <input type="radio" name="gender">
            <label for="gender">Non-binary</label>
            <input type="radio" name="gender">
            <label for="gender">I prefer not to answer</label>
        </div>
        <div>
            <label for="description">A short description about myself:</label>
        </div>
        <textarea name="description" id=""></textarea>
        <div>
            <label for="language">Favorite Language:</label>
            <select name="language" id="language">
                <option value="Python">Python</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Matlab">Matlab</option>
            </select>
        </div>
        <div>
            <input type="checkbox" id="periodic" name="periodic">
            <label for="periodic">yes,I would like to recieve periodic email updates</label>
        </div>
        <div>
            <input type="button" value="Create Account">
        </div>
            <label for="">* Indicates a reqired field</label>
    </form>
</body>

</html>
